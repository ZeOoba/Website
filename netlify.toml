# Netlify config — keep _headers + _redirects as the source of truth for
# headers/redirects (do not duplicate here). This file exists for
# edge-function and serverless-function routing.

# The publish dir is ASSEMBLED: the repo root mixes the public site with
# internal tooling (scripts/, evals/, netlify/ source), so deploys publish only
# the allowlisted copy in dist/. Deploy with `netlify deploy --build` so dist/
# is rebuilt first; never deploy --dir=. (that re-publishes the whole repo root).
[build]
  command = "node scripts/build-dist.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  # @netlify/blobs is required from CommonJS inside _shared/broker-score-store.js.
  # When that module is reached from an ESM (V2) function entry, esbuild inlines
  # the module but leaves its require() as a runtime call, and the package is not
  # in the bundle -- "Cannot find module '@netlify/blobs'", caught by an
  # outside-in probe against deploy-preview-72, never by a local test.
  # Marking it external ships it in the function's node_modules instead.
  external_node_modules = ["@netlify/blobs"]

[functions."chat-lead"]
  included_files = []

[[edge_functions]]
  path = "/api/chat"
  function = "chat"
