# Netlify config — keep _headers + _redirects as the source of truth for
# headers/redirects (do not duplicate here). This file exists for
# edge-function and serverless-function routing.

# The publish dir is ASSEMBLED: the repo root mixes the public site with
# internal tooling (scripts/, evals/, netlify/ source), so deploys publish only
# the allowlisted copy in dist/. Deploy with `netlify deploy --build` so dist/
# is rebuilt first; never deploy --dir=. (that re-publishes the whole repo root).
#
# The build command is `npm run build` (package.json): the same chain CI's
# `npm run verify` runs first, including the listings/portfolio `--check` drift
# gates, so a stale generated page fails the production build instead of
# shipping. Keep the chain in ONE place (package.json) so the two cannot
# diverge again.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[functions."chat-lead"]
  included_files = []

[[edge_functions]]
  path = "/api/chat"
  function = "chat"
