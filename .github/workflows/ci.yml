# CI for oxfordra.net.
#
# Before this workflow existed the repo had no automated verification of
# correctness at all: package.json's only script was `postinstall`, which
# patches a deploy *authorization* guard into the netlify CLI — an access
# check, not a correctness check. Verification was "run validate-jsonld.js by
# hand, grep for some strings, look at the site in a browser": human-remembered,
# therefore skippable, and skipped.
#
# The `verify` job below is the pre-merge gate. It is deliberately built out of
# environment emulators rather than more `require()`-level unit tests, because
# the regressions this repo actually shipped were properties of environments:
# the served response headers (CSP) and the Netlify function runtime.
#
# NOTHING HERE DEPLOYS. There is no `netlify deploy` in this file and there must
# never be one — oxfordra.net production deploys require Gabriel's explicit
# per-deploy confirmation.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      eval_base:
        description: >-
          Base URL to run the chat eval against (e.g. a Netlify deploy-preview
          URL). Leave blank to skip the eval job.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & verify
    # Runner is chosen by the CI_RUNNER repo variable (a JSON label array, e.g.
    # ["self-hosted","Windows","X64"]). Unset = GitHub-hosted ubuntu-latest, so
    # merging this changes nothing until the variable is set; deleting the
    # variable switches back. Same-repo PRs only: a fork PR must never run its
    # code on a self-hosted machine.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-25)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-25)
        with:
          # Matches netlify.toml [build.environment] NODE_VERSION — CI must run
          # the same major as the deploy build, or it verifies a different site.
          node-version: '20'
          # The npm cache only helps GitHub-hosted runners (fresh VM each job). On the
          # self-hosted laptop runner the disk already persists the npm cache, and the
          # setup-node post-step that SAVES it hung for 22 minutes after a passing Verify
          # step until the 25-minute job timeout cancelled the job (2026-10-15, runs
          # 38572674582 and 38574077301). Empty string = no cache = no post-step save.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      # --with-deps installs Linux OS packages; it is meaningless on a Windows
      # runner, which only needs the browser itself.
      - name: Install Chromium for the CSP smoke test (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium for the CSP smoke test
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      # `npm run verify` chains: build -> verify:jsonld -> test:unit ->
      # test:site (CSP) -> test:functions (Netlify runtime). Any failure fails
      # the PR. Kept as one step so the local command and the CI command are
      # literally identical — a developer can reproduce a red build with
      # `npm run verify` and nothing else.
      - name: Verify
        # Only needed once scripts/leak-gate-hashes.json is generated with --keyed (docs/leak-gate.md);
        # empty or unset is correct while the committed hashes are unkeyed.
        env:
          LEAK_GATE_KEY: ${{ secrets.LEAK_GATE_KEY }}
        run: npm run verify

  # NOT part of the PR gate, on purpose. eval-chat.mjs drives the live
  # /api/chat edge function, which costs real model tokens per case and needs a
  # deployed origin; running it per-PR would either bill every push or hit
  # production. Run it by hand against a deploy preview before a release:
  #   Actions -> CI -> Run workflow -> eval_base = https://<preview>.netlify.app
  eval-chat:
    name: Chat regression eval (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.eval_base != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (resolved 2026-09-25)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-09-25)
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run chat eval
        # Pass the dispatch input through an env var, never by interpolating
        # ${{ }} into the shell line (GitHub Actions expression injection).
        env:
          EVAL_BASE: ${{ inputs.eval_base }}
        run: npm run eval:chat -- --base="$EVAL_BASE"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (resolved 2026-09-25)
        with:
          name: eval-results
          path: evals/results-*.json
          if-no-files-found: warn
