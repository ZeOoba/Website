<!DOCTYPE html>
<!--
  Hidden form so Netlify Forms registers the `broker-network-ledger` form
  on deploy. Not linked from anywhere; noindex. broker-finalize.js forwards
  metadata here programmatically (the OM file itself never touches Netlify
  Forms — see docs/superpowers/specs/2026-07-10-tenant-application-om-upload-pipeline-design.md).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Broker Network Ledger (internal)</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<form name="broker-network-ledger" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="broker-network-ledger">
  <input type="text" name="name">
  <input type="text" name="company">
  <input type="email" name="email">
  <input type="text" name="phone">
  <input type="text" name="market">
  <textarea name="message"></textarea>
  <input type="text" name="document-path">
</form>
</body>
</html>
