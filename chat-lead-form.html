<!DOCTYPE html>
<!--
  Hidden form so Netlify Forms registers the `chat-lead` form on deploy.
  Not linked from anywhere; noindex. The chat widget submits programmatically
  via /api/chat-lead which forwards to Netlify Forms.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat Lead Form (internal)</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<form name="chat-lead" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="hidden" name="form-name" value="chat-lead">
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="text" name="phone">
  <input type="text" name="role">
  <textarea name="message"></textarea>
  <input type="text" name="session-id">
  <textarea name="transcript"></textarea>
  <input type="text" name="submitted-at">
  <input type="text" name="lead-landing">
  <input type="text" name="lead-referrer">
  <input type="text" name="website">
</form>
</body>
</html>
